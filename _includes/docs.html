{%- if include.list.size > 0 or include.link -%}
<ul class="docs">
  {%- for d in include.list -%}{%- if d.file -%}<li class="doc"><a href="{{ d.file | relative_url }}" target="_blank" rel="noopener">{{ d.title | default: "Document" }}</a></li>{%- endif -%}{%- endfor -%}
  {%- if include.link -%}<li><a href="{{ include.link }}" target="_blank" rel="noopener">Read more ›</a></li>{%- endif -%}
</ul>
{%- endif -%}
